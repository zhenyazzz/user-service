services:
  user-service-postgresql:
    image: postgres:15
    container_name: user-service-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-user_service_db}
      POSTGRES_USER: ${POSTGRES_USER:-user_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user_service_secret}
    ports:
      - "5432:5432"
    volumes:
      - user-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user_service} -d ${POSTGRES_DB:-user_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.5-alpine
    container_name: user-service-redis
    ports:
      - "6379:6379"
    volumes:
      - user-service-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service-app
    ports:
      - "${USER_SERVICE_PORT:-8080}:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://user-service-postgresql:5432/user_service_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-user_service}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-user_service_secret}
    depends_on:
      user-service-postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  user-service-db-data:
  user-service-redis-data:
