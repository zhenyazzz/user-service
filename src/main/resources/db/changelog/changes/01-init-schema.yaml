databaseChangeLog:
  - changeSet:
      id: 01-init-schema
      author: dev
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: surname
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: birth_date
                  type: DATE
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
                  
        - createIndex:
            indexName: idx_users_name_surname
            tableName: users
            columns:
              - column:
                  name: name
              - column:
                  name: surname
        
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: UUID
                  constraints: 
                    nullable: false
                    foreignKeyName: fk_payment_card_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: number
                  type: VARCHAR(20)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: holder
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: expiration_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints: { nullable: false }

        - createIndex:
            indexName: idx_payment_cards_user_id_active
            tableName: payment_cards
            columns:
              - column:
                  name: user_id
              - column:
                  name: active
